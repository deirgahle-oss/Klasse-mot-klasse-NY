<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Arrangør - Klasse mot klasse (Alle mot 1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-yellow-400">Arrangørpanel - Alle mot 1</h1>

        <!-- Konkurranse- og klasseadministrasjon -->
        <div class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-4">
            <h2 class="text-xl font-semibold text-cyan-400">1. Administrer Konkurranse & Klasser</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Opprett ny konkurranse:</label>
                    <input type="text" id="compTitle" placeholder="F.eks. Alle mot 1 - Vår 2026" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white mb-2">
                    <button id="createCompBtn" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded font-bold w-full">Opprett Konkurranse</button>
                </div>
                <div>
                    <label class="block text-sm mb-1">Legg til ekstra klasse:</label>
                    <div class="flex gap-2">
                        <input type="text" id="classNameInput" placeholder="Klassenavn" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                        <button id="addClassBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-bold">Legg til</button>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm mb-1 font-semibold mt-4">Velg aktiv konkurranse:</label>
                <select id="competitionSelect" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                    <option value="">-- Velg konkurranse --</option>
                </select>
            </div>
        </div>

        <!-- Legg til Spørsmål ("Alle mot 1" oppsett) -->
        <div id="questionSection" class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-4 hidden">
            <h2 class="text-xl font-semibold text-cyan-400">2. Opprett "Alle mot 1"-oppgave</h2>
            
            <div>
                <label class="block text-sm mb-1">Oppgavetekst:</label>
                <textarea id="qText" rows="3" placeholder="F.eks. Hvor mange sekunder / minutter bruker lærerne på å løpe 100 meter?" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Hvilken klasse har laget oppgaven?</label>
                    <select id="qCreatorClass" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                        <option value="Arrangør">Arrangør (Alle kan svare)</option>
                        <option value="Aqua">Aqua</option>
                        <option value="Capture">Capture</option>
                        <option value="FriX">FriX</option>
                        <option value="Global Active">Global Active</option>
                        <option value="Global eXtreme">Global eXtreme</option>
                        <option value="Musikal&Reise">Musikal&Reise</option>
                        <option value="Musikk&Reise">Musikk&Reise</option>
                        <option value="Reise&Bistand">Reise&Bistand</option>
                        <option value="Sport&Outdoor">Sport&Outdoor</option>
                        <option value="Stipendiatene">Stipendiatene</option>
                        <option value="Ansatt">Ansatt</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-1">Enhet:</label>
                    <select id="qUnitType" onchange="toggleCustomUnit()" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                        <option value="tid">Tid (min:sek / desimaltall)</option>
                        <option value="cm">cm</option>
                        <option value="meter">meter</option>
                        <option value="liter">liter</option>
                        <option value="antall">antall</option>
                        <option value="egendefinert">Egendefinert</option>
                    </select>
                </div>
            </div>

            <div id="customUnitContainer" class="hidden">
                <label class="block text-sm mb-1">Skriv inn egendefinert enhet:</label>
                <input type="text" id="qCustomUnit" placeholder="F.eks. kg, poeng, runder" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm mb-1">Minimum utfall:</label>
                    <input type="number" step="any" id="qMin" placeholder="0" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1">Maksimum utfall:</label>
                    <input type="number" step="any" id="qMax" placeholder="300" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1">Steg (hvor mye den hopper):</label>
                    <input type="number" step="any" id="qStep" placeholder="1" value="1" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
            </div>

            <div>
                <label class="block text-sm mb-1">Last opp oppgavebilde:</label>
                <input type="file" id="qImageFile" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white text-sm">
            </div>

            <div>
                <label class="block text-sm mb-1">Fasit (tallverdi, kan fylles ut senere):</label>
                <input type="number" step="any" id="qCorrect" placeholder="F.eks. 75.5" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
            </div>

            <button id="addQuestionBtn" class="bg-cyan-600 hover:bg-cyan-500 px-6 py-3 rounded font-bold w-full text-lg">Lagre Oppgave</button>
        </div>

        <!-- Oversikt over opprettede spørsmål for valgt konkurranse -->
        <div id="questionListSection" class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-4 hidden">
            <h2 class="text-xl font-semibold text-yellow-400">3. Spørsmålsbank for denne konkurransen</h2>
            <div id="questionsContainer" class="space-y-3">
                <!-- Spørsmål listes opp her dynamisk -->
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        async function loadCompetitions() {
            const { data: comps } = await supabase.from('competitions').select('*');
            const select = document.getElementById('competitionSelect');
            select.innerHTML = '<option value="">-- Velg konkurranse --</option>' + (comps || []).map(co => `
                <option value="${co.id}">${co.title}</option>
            `).join('');
        }

        window.toggleCustomUnit = function() {
            const val = document.getElementById('qUnitType').value;
            const container = document.getElementById('customUnitContainer');
            if (val === 'egendefinert') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        async function loadQuestionsForCompetition(compId) {
            const section = document.getElementById('questionListSection');
            const container = document.getElementById('questionsContainer');
            if (!compId) {
                section.classList.add('hidden');
                return;
            }
            section.classList.remove('hidden');

            const { data: questions, error } = await supabase
                .from('questions')
                .select('*')
                .eq('competition_id', compId)
                .order('id', { ascending: true });

            if (error) {
                container.innerHTML = `<p class="text-red-400">Kunne ikke laste oppgaver: ${error.message}</p>`;
                return;
            }

            if (!questions || questions.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic">Ingen oppgaver opprettet enda.</p>`;
                return;
            }

            container.innerHTML = questions.map((q, index) => `
                <div class="bg-slate-900 p-4 rounded border border-slate-700 flex justify-between items-center">
                    <div>
                        <span class="text-cyan-400 font-bold">#${index + 1}</span> 
                        <span class="font-medium">${q.question_text}</span>
                        <div class="text-xs text-slate-400 mt-1">
                            Laget av: <span class="text-yellow-300">${q.created_by_class}</span> | 
                            Område: ${q.min_value} til ${q.max_value} (${q.unit_type}) | 
                            Fasit: ${q.correct_answer !== null ? q.correct_answer : 'Ikke satt'}
                        </div>
                    </div>
                    <button onclick="deleteQuestion(${q.id})" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm font-bold">Slett</button>
                </div>
            `).join('');
        }

        window.deleteQuestion = async function(id) {
            if (!confirm('Er du sikker på at du vil slette denne oppgaven?')) return;
            const { error } = await supabase.from('questions').delete().eq('id', id);
            if (error) {
                alert('Feil ved sletting: ' + error.message);
                return;
            }
            const compId = document.getElementById('competitionSelect').value;
            loadQuestionsForCompetition(compId);
        }

        document.getElementById('createCompBtn').addEventListener('click', async () => {
            const title = document.getElementById('compTitle').value.trim();
            if (!title) return;
            const { error } = await supabase.from('competitions').insert([{ title, status: 'setup' }]);
            if (error) { alert('Feil: ' + error.message); return; }
            document.getElementById('compTitle').value = '';
            loadCompetitions();
            alert('Konkurranse opprettet!');
        });

        document.getElementById('competitionSelect').addEventListener('change', (e) => {
            const id = e.target.value;
            const qSection = document.getElementById('questionSection');
            if (!id) {
                qSection.classList.add('hidden');
                document.getElementById('questionListSection').classList.add('hidden');
            } else {
                qSection.classList.remove('hidden');
                loadQuestionsForCompetition(id);
            }
        });

        document.getElementById('addQuestionBtn').addEventListener('click', async () => {
            const competition_id = document.getElementById('competitionSelect').value;
            const question_text = document.getElementById('qText').value.trim();
            const created_by_class = document.getElementById('qCreatorClass').value;
            const unit_type = document.getElementById('qUnitType').value;
            const custom_unit = document.getElementById('qCustomUnit').value.trim();
            const min_value = parseFloat(document.getElementById('qMin').value);
            const max_value = parseFloat(document.getElementById('qMax').value);
            const step_value = parseFloat(document.getElementById('qStep').value) || 1;
            const correct_answer = document.getElementById('qCorrect').value !== '' ? parseFloat(document.getElementById('qCorrect').value) : null;

            if (!competition_id || !question_text || isNaN(min_value) || isNaN(max_value)) {
                alert('Vennligst fyll ut oppgavetekst, minimum og maksimum utfall.');
                return;
            }

            const { error } = await supabase.from('questions').insert([{
                competition_id,
                question_text,
                created_by_class,
                unit_type,
                custom_unit,
                min_value,
                max_value,
                step_value,
                correct_answer,
                status: 'pending'
            }]);

            if (error) {
                alert('Feil ved lagring: ' + error.message);
                return;
            }

            alert('Oppgaven er lagret!');
            document.getElementById('qText').value = '';
            document.getElementById('qMin').value = '';
            document.getElementById('qMax').value = '';
            document.getElementById('qCorrect').value = '';
            loadQuestionsForCompetition(competition_id);
        });

        loadCompetitions();
    </script>
</body>
</html>
