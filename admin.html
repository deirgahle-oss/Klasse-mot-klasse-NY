<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Test - Arrangør</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Hent Supabase direkte via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-yellow-400">Testpanel - Klasse mot klasse</h1>
        
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <h2 class="text-xl font-semibold text-cyan-400">Status på tilkobling:</h2>
            <p id="statusText" class="text-lg text-amber-300">Kobler til databasen...</p>
            <button onclick="testOppretting()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded font-bold">Test oppretting av testkonkurranse</button>
        </div>
    </div>

    <script>
        // Initialiser Supabase direkte uten modul-trøbbel
        const supabaseUrl = 'https://uwsvsfepktigasnpolql.supabase.co';
        const supabaseKey = 'sb_publishable_BevPqXgGFbuGtRBvz0uQNQ_yuSqxbSx';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function sjekkTilgang() {
            try {
                const { data, error } = await supabase.from('classes').select('*');
                if (error) {
                    document.getElementById('statusText').textContent = 'Feil fra databasen: ' + error.message;
                    document.getElementById('statusText').className = 'text-lg text-red-400 font-bold';
                } else {
                    document.getElementById('statusText').textContent = 'Tilkobling vellykket! Fant ' + data.length + ' klasser i databasen.';
                    document.getElementById('statusText').className = 'text-lg text-emerald-400 font-bold';
                }
            } catch (err) {
                document.getElementById('statusText').textContent = 'Kritisk feil: ' + err.message;
                document.getElementById('statusText').className = 'text-lg text-red-400 font-bold';
            }
        }

        async function testOppretting() {
            const { error } = await supabase.from('competitions').insert([{ title: 'Testkonkurranse fra testside', status: 'setup' }]);
            if (error) {
                alert('Feil ved oppretting: ' + error.message);
            } else {
                alert('Testkonkurranse opprettet med suksess!');
                sjekkTilgang();
            }
        }

        sjekkTilgang();
    </script>
</body>
</html>
