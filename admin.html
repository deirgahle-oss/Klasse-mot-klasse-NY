<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Arrangør - Klasse mot klasse (Alle mot 1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-yellow-400">Arrangørpanel - Alle mot 1</h1>

        <!-- Konkurranse- og klasseadministrasjon -->
        <div class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-6">
            <h2 class="text-xl font-semibold text-cyan-400">1. Administrer Konkurranse & Klasser</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Opprett konkurranse -->
                <div class="bg-slate-900 p-4 rounded border border-slate-700">
                    <label class="block text-sm mb-1 font-semibold">Opprett ny konkurranse:</label>
                    <input type="text" id="compTitle" placeholder="F.eks. Alle mot 1 - Vår 2026" class="w-full p-2 rounded bg-slate-800 border border-slate-600 text-white mb-2">
                    <button id="createCompBtn" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded font-bold w-full">Opprett Konkurranse</button>
                </div>

                <!-- Legg til ny klasse i systemet -->
                <div class="bg-slate-900 p-4 rounded border border-slate-700">
                    <label class="block text-sm mb-1 font-semibold">Legg til ny klasse i systemet:</label>
                    <div class="flex gap-2">
                        <input type="text" id="classNameInput" placeholder="F.eks. 10B eller Media" class="w-full p-2 rounded bg-slate-800 border border-slate-600 text-white">
                        <button id="addClassBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-bold">Legg til</button>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm mb-1 font-semibold">Velg aktiv konkurranse:</label>
                <select id="competitionSelect" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                    <option value="">-- Velg konkurranse --</option>
                </select>
            </div>

            <!-- Avhukingsliste for klasser som deltar i valgt konkurranse -->
            <div id="classSelectionContainer" class="hidden pt-4 border-t border-slate-700 space-y-3">
                <h3 class="text-md font-semibold text-yellow-300">Velg hvilke klasser som deltar i denne konkurransen:</h3>
                <div id="classListCheckboxes" class="grid grid-cols-2 md:grid-cols-3 gap-3 bg-slate-900 p-4 rounded border border-slate-700">
                    <!-- Huker fylles inn dynamisk -->
                </div>
                <button id="saveCompClassesBtn" class="bg-yellow-600 hover:bg-yellow-500 px-4 py-2 rounded font-bold text-black">Lagre deltakende klasser</button>
            </div>
        </div>

        <!-- Legg til / Rediger Spørsmål -->
        <div id="questionSection" class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-4 hidden">
            <h2 id="formTitle" class="text-xl font-semibold text-cyan-400">2. Opprett "Alle mot 1"-oppgave</h2>
            <input type="hidden" id="editingQuestionId" value="">
            
            <div>
                <label class="block text-sm mb-1">Oppgavetekst:</label>
                <textarea id="qText" rows="3" placeholder="F.eks. Hvor lang tid bruker rektor på å løpe 100 meter?" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Hvilken klasse har laget oppgaven?</label>
                    <select id="qCreatorClass" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                        <option value="Arrangør">Arrangør (Alle kan svare)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-1">Enhet:</label>
                    <select id="qUnitType" onchange="handleUnitChange()" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                        <option value="tid">Tid (skriv som min:sek, f.eks. 1:30)</option>
                        <option value="cm">cm</option>
                        <option value="meter">meter</option>
                        <option value="liter">liter</option>
                        <option value="antall">antall</option>
                        <option value="egendefinert">Egendefinert</option>
                    </select>
                </div>
            </div>

            <div id="customUnitContainer" class="hidden">
                <label class="block text-sm mb-1">Skriv inn egendefinert enhet:</label>
                <input type="text" id="qCustomUnit" placeholder="F.eks. kg, poeng, runder" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm mb-1">Minimum utfall (tall eller min:sek):</label>
                    <input type="text" id="qMin" placeholder="0 eller 0:00" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1">Maksimum utfall (tall eller min:sek):</label>
                    <input type="text" id="qMax" placeholder="300 eller 5:00" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1">Steg (sekunder eller tall):</label>
                    <input type="number" step="any" id="qStep" placeholder="1" value="1" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
            </div>

            <div>
                <label class="block text-sm mb-1">Fasit (tall eller min:sek, f.eks. 1:15):</label>
                <input type="text" id="qCorrect" placeholder="F.eks. 1:15" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
            </div>

            <div class="flex gap-4">
                <button id="saveQuestionBtn" class="bg-cyan-600 hover:bg-cyan-500 px-6 py-3 rounded font-bold flex-1 text-lg">Lagre Oppgave</button>
                <button id="cancelEditBtn" class="bg-slate-600 hover:bg-slate-500 px-4 py-3 rounded font-bold hidden">Avbryt</button>
            </div>
        </div>

        <!-- Oversikt over opprettede spørsmål -->
        <div id="questionListSection" class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-4 hidden">
            <h2 class="text-xl font-semibold text-yellow-400">3. Spørsmålsbank for denne konkurransen</h2>
            <div id="questionsContainer" class="space-y-3">
                <!-- Spørsmål listes opp her dynamisk -->
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        let currentQuestions = [];
        let allClasses = [];

        async function initData() {
            // Hent alle klasser fra databasen
            const { data: classesData } = await supabase.from('classes').select('*').order('name');
            allClasses = classesData || [];

            // Oppdater nedtrekkslisten for hvem som har laget oppgaven
            updateCreatorClassDropdown();

            // Hent konkurranser
            const { data: comps } = await supabase.from('competitions').select('*');
            const select = document.getElementById('competitionSelect');
            select.innerHTML = '<option value="">-- Velg konkurranse --</option>' + (comps || []).map(co => `
                <option value="${co.id}">${co.title}</option>
            `).join('');
        }

        function updateCreatorClassDropdown() {
            const select = document.getElementById('qCreatorClass');
            let html = '<option value="Arrangør">Arrangør (Alle kan svare)</option>';
            allClasses.forEach(c => {
                html += `<option value="${c.name}">${c.name}</option>`;
            });
            select.innerHTML = html;
        }

        async function renderClassCheckboxes(selectedClassNames = []) {
            const box = document.getElementById('classListCheckboxes');
            if (allClasses.length === 0) {
                box.innerHTML = '<p class="text-slate-400 text-sm italic">Ingen klasser lagt til i systemet ennå. Bruk "Legg til ny klasse i systemet" ovenfor.</p>';
                return;
            }

            box.innerHTML = allClasses.map(c => {
                const isChecked = selectedClassNames.includes(c.name) ? 'checked' : '';
                return `
                    <label class="flex items-center gap-2 cursor-pointer p-1 hover:bg-slate-800 rounded">
                        <input type="checkbox" value="${c.name}" class="comp-class-cb w-4 h-4 accent-cyan-500" ${isChecked}> 
                        <span>${c.name}</span>
                    </label>
                `;
            }).join('');
        }

        window.handleUnitChange = function() {
            const val = document.getElementById('qUnitType').value;
            const container = document.getElementById('customUnitContainer');
            if (val === 'egendefinert') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function parseInputToNumber(valueStr) {
            if (!valueStr) return null;
            valueStr = String(valueStr).trim();
            if (valueStr.includes(':')) {
                const parts = valueStr.split(':');
                const minutes = parseFloat(parts[0]) || 0;
                const seconds = parseFloat(parts[1]) || 0;
                return (minutes * 60) + seconds;
            }
            return parseFloat(valueStr);
        }

        function formatValue(val, unitType) {
            if (val === null || val === undefined) return 'Ikke satt';
            if (unitType === 'tid') {
                const mins = Math.floor(val / 60);
                const secs = Math.round(val % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            return val;
        }

        async function loadQuestionsForCompetition(compId) {
            const section = document.getElementById('questionListSection');
            const container = document.getElementById('questionsContainer');
            if (!compId) {
                section.classList.add('hidden');
                return;
            }
            section.classList.remove('hidden');

            const { data: questions, error } = await supabase
                .from('questions')
                .select('*')
                .eq('competition_id', compId)
                .order('sort_order', { ascending: true })
                .order('id', { ascending: true });

            if (error) {
                container.innerHTML = `<p class="text-red-400">Kunne ikke laste oppgaver: ${error.message}</p>`;
                return;
            }

            currentQuestions = questions || [];

            if (currentQuestions.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic">Ingen oppgaver opprettet enda.</p>`;
                return;
            }

            container.innerHTML = currentQuestions.map((q, index) => {
                const minFormatted = formatValue(q.min_value, q.unit_type);
                const maxFormatted = formatValue(q.max_value, q.unit_type);
                const correctFormatted = formatValue(q.correct_answer, q.unit_type);
                const unitLabel = q.unit_type === 'tid' ? 'sekunder (min:sek)' : (q.custom_unit || q.unit_type);

                return `
                    <div class="bg-slate-900 p-4 rounded border border-slate-700 flex justify-between items-center">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-cyan-400 font-bold">#${index + 1}</span> 
                                <span class="font-medium text-lg">${q.question_text}</span>
                            </div>
                            <div class="text-xs text-slate-400">
                                Laget av: <span class="text-yellow-300">${q.created_by_class}</span> | 
                                Område: ${minFormatted} til ${maxFormatted} (${unitLabel}) | 
                                Fasit: ${correctFormatted}
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="moveQuestion(${q.id}, 'up')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-sm font-bold" title="Flytt opp">⬆️</button>
                            <button onclick="moveQuestion(${q.id}, 'down')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-sm font-bold" title="Flytt ned">⬇️</button>
                            <button onclick="editQuestion(${q.id})" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-sm font-bold">Rediger</button>
                            <button onclick="deleteQuestion(${q.id})" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm font-bold">Slett</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.moveQuestion = async function(id, direction) {
            const index = currentQuestions.findIndex(q => q.id === id);
            if (index === -1) return;

            const targetIndex = direction === 'up' ? index - 1 : index + 1;
            if (targetIndex < 0 || targetIndex >= currentQuestions.length) return;

            const temp = currentQuestions[index];
            currentQuestions[index] = currentQuestions[targetIndex];
            currentQuestions[targetIndex] = temp;

            for (let i = 0; i < currentQuestions.length; i++) {
                await supabase.from('questions').update({ sort_order: i }).eq('id', currentQuestions[i].id);
            }

            const compId = document.getElementById('competitionSelect').value;
            loadQuestionsForCompetition(compId);
        }

        window.editQuestion = function(id) {
            const q = currentQuestions.find(item => item.id === id);
            if (!q) return;

            document.getElementById('editingQuestionId').value = q.id;
            document.getElementById('formTitle').textContent = 'Rediger "Alle mot 1"-oppgave';
            document.getElementById('saveQuestionBtn').textContent = 'Lagre Endringer';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            document.getElementById('qText').value = q.question_text;
            document.getElementById('qCreatorClass').value = q.created_by_class;
            document.getElementById('qUnitType').value = q.unit_type;
            document.getElementById('qCustomUnit').value = q.custom_unit || '';
            
            function formatForInput(val, unitType) {
                if (val === null || val === undefined) return '';
                if (unitType === 'tid') {
                    const mins = Math.floor(val / 60);
                    const secs = Math.round(val % 60);
                    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
                return val;
            }

            document.getElementById('qMin').value = formatForInput(q.min_value, q.unit_type);
            document.getElementById('qMax').value = formatForInput(q.max_value, q.unit_type);
            document.getElementById('qStep').value = q.step_value || 1;
            document.getElementById('qCorrect').value = formatForInput(q.correct_answer, q.unit_type);

            handleUnitChange();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            resetForm();
        });

        function resetForm() {
            document.getElementById('editingQuestionId').value = '';
            document.getElementById('formTitle').textContent = '2. Opprett "Alle mot 1"-oppgave';
            document.getElementById('saveQuestionBtn').textContent = 'Lagre Oppgave';
            document.getElementById('cancelEditBtn').classList.add('hidden');

            document.getElementById('qText').value = '';
            document.getElementById('qMin').value = '';
            document.getElementById('qMax').value = '';
            document.getElementById('qStep').value = '1';
            document.getElementById('qCorrect').value = '';
            document.getElementById('qCustomUnit').value = '';
        }

        window.deleteQuestion = async function(id) {
            if (!confirm('Er du sikker på at du vil slette denne oppgaven?')) return;
            const { error } = await supabase.from('questions').delete().eq('id', id);
            if (error) {
                alert('Feil ved sletting: ' + error.message);
                return;
            }
            const compId = document.getElementById('competitionSelect').value;
            loadQuestionsForCompetition(compId);
        }

        // Legg til ny klasse i systemet
        document.getElementById('addClassBtn').addEventListener('click', async () => {
            const name = document.getElementById('classNameInput').value.trim();
            if (!name) return;
            const { error } = await supabase.from('classes').insert([{ name }]);
            if (error) {
                alert('Feil ved lagring av klasse: ' + error.message);
                return;
            }
            document.getElementById('classNameInput').value = '';
            await initData();
            alert(`Klassen "${name}" ble lagt til i systemet!`);
        });

        document.getElementById('createCompBtn').addEventListener('click', async () => {
            const title = document.getElementById('compTitle').value.trim();
            if (!title) return;
            const { error } = await supabase.from('competitions').insert([{ title, status: 'setup' }]);
            if (error) { alert('Feil: ' + error.message); return; }
            document.getElementById('compTitle').value = '';
            initData();
            alert('Konkurranse opprettet!');
        });

        document.getElementById('competitionSelect').addEventListener('change', async (e) => {
            const id = e.target.value;
            const qSection = document.getElementById('questionSection');
            const classContainer = document.getElementById('classSelectionContainer');
            
            if (!id) {
                qSection.classList.add('hidden');
                classContainer.classList.add('hidden');
                document.getElementById('questionListSection').classList.add('hidden');
                return;
            }

            classContainer.classList.remove('hidden');
            qSection.classList.remove('hidden');
            loadQuestionsForCompetition(id);
            resetForm();

            // Hent hvilke klasser som er lagret på denne konkurransen fra før
            const { data: compData } = await supabase.from('competitions').select('active_class_names').eq('id', id).single();
            const activeClasses = compData && compData.active_class_names ? compData.active_class_names : [];
            renderClassCheckboxes(activeClasses);
        });

        // Lagre avhukede klasser for konkurransen
        document.getElementById('saveCompClassesBtn').addEventListener('click', async () => {
            const id = document.getElementById('competitionSelect').value;
            if (!id) return;

            const selectedClasses = Array.from(document.querySelectorAll('.comp-class-cb:checked')).map(cb => cb.value);

            const { error } = await supabase.from('competitions')
                .update({ active_class_names: selectedClasses })
                .eq('id', id);

            if (error) {
                alert('Feil ved lagring av deltakende klasser: ' + error.message);
                return;
            }

            alert('Deltakende klasser for denne konkurransen er lagret!');
        });

        document.getElementById('saveQuestionBtn').addEventListener('click', async () => {
            const competition_id = document.getElementById('competitionSelect').value;
            const question_text = document.getElementById('qText').value.trim();
            const created_by_class = document.getElementById('qCreatorClass').value;
            const unit_type = document.getElementById('qUnitType').value;
            const custom_unit = document.getElementById('qCustomUnit').value.trim();
            
            const min_value = parseInputToNumber(document.getElementById('qMin').value);
            const max_value = parseInputToNumber(document.getElementById('qMax').value);
            const step_value = parseFloat(document.getElementById('qStep').value) || 1;
            const correct_answer = parseInputToNumber(document.getElementById('qCorrect').value);
            const editingId = document.getElementById('editingQuestionId').value;

            if (!competition_id || !question_text || isNaN(min_value) || isNaN(max_value)) {
                alert('Vennligst fyll ut oppgavetekst, minimum og maksimum utfall.');
                return;
            }

            if (editingId) {
                const { error } = await supabase.from('questions').update({
                    question_text,
                    created_by_class,
                    unit_type,
                    custom_unit,
                    min_value,
                    max_value,
                    step_value,
                    correct_answer: isNaN(correct_answer) ? null : correct_answer
                }).eq('id', editingId);

                if (error) {
                    alert('Feil ved oppdatering: ' + error.message);
                    return;
                }
                alert('Oppgaven er oppdatert!');
            } else {
                const nextOrder = currentQuestions.length;
                const { error } = await supabase.from('questions').insert([{
                    competition_id,
                    question_text,
                    created_by_class,
                    unit_type,
                    custom_unit,
                    min_value,
                    max_value,
                    step_value,
                    correct_answer: isNaN(correct_answer) ? null : correct_answer,
                    status: 'pending',
                    sort_order: nextOrder
                }]);

                if (error) {
                    alert('Feil ved lagring: ' + error.message);
                    return;
                }
                alert('Oppgaven er lagret!');
            }

            resetForm();
