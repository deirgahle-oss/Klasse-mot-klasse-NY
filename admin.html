<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Arrangør - Klasse mot klasse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-yellow-400">Arrangørpanel - Klasse mot klasse</h1>

        <!-- Konkurranse- og klasseadministrasjon -->
        <div class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-6">
            <h2 class="text-xl font-semibold text-cyan-400">1. Administrer Konkurranse & Klasser</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-900 p-4 rounded border border-slate-700">
                    <label class="block text-sm mb-1 font-semibold">Opprett ny konkurranse:</label>
                    <input type="text" id="compTitle" placeholder="F.eks. Klasse mot klasse - Vår 2026" class="w-full p-2 rounded bg-slate-800 border border-slate-600 text-white mb-2">
                    <button id="createCompBtn" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded font-bold w-full">Opprett Konkurranse</button>
                </div>

                <div class="bg-slate-900 p-4 rounded border border-slate-700">
                    <label class="block text-sm mb-1 font-semibold">Legg til ny klasse i systemet:</label>
                    <div class="flex gap-2">
                        <input type="text" id="classNameInput" placeholder="F.eks. 10B eller Media" class="w-full p-2 rounded bg-slate-800 border border-slate-600 text-white">
                        <button id="addClassBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-bold">Legg til</button>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm mb-1 font-semibold">Velg aktiv konkurranse:</label>
                <select id="competitionSelect" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                    <option value="">-- Velg konkurranse --</option>
                </select>
            </div>

            <div id="classSelectionContainer" class="hidden pt-4 border-t border-slate-700 space-y-3">
                <h3 class="text-md font-semibold text-yellow-300">Velg hvilke klasser som deltar i denne konkurransen:</h3>
                <div id="classListCheckboxes" class="grid grid-cols-2 md:grid-cols-3 gap-3 bg-slate-900 p-4 rounded border border-slate-700"></div>
                <button id="saveCompClassesBtn" class="bg-yellow-600 hover:bg-yellow-500 px-4 py-2 rounded font-bold text-black">Lagre deltakende klasser</button>
            </div>
        </div>

        <!-- LIVE KONTROLLER (De nye knappene) -->
        <div id="liveControlSection" class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-4 hidden">
            <h2 class="text-xl font-semibold text-emerald-400">🎮 Live Spillkontroller</h2>
            <div id="activeLiveStatus" class="text-sm bg-slate-900 p-3 rounded border border-slate-700 text-slate-300">
                Status: Ingen aktiv oppgave pågår.
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <button onclick="startKlasseMotKlasse()" class="bg-cyan-600 hover:bg-cyan-500 p-3 rounded font-bold text-sm shadow">🚀 Start klasse mot klasse</button>
                <button onclick="lockAnswersCountdown()" class="bg-amber-600 hover:bg-amber-500 p-3 rounded font-bold text-sm shadow">⏳ Lås svar - 5 sekunder igjen</button>
                <button onclick="openAnswersAgain()" class="bg-blue-600 hover:bg-blue-500 p-3 rounded font-bold text-sm shadow">🔓 Åpne svar</button>
                <button onclick="nextQuestion()" class="bg-emerald-600 hover:bg-emerald-500 p-3 rounded font-bold text-sm shadow">⏭️ Neste oppgave</button>
                <button onclick="showTop3Modal()" class="bg-purple-600 hover:bg-purple-500 p-3 rounded font-bold text-sm shadow">🏆 Vis topp 3</button>
                <button onclick="completeCompetition()" class="bg-red-600 hover:bg-red-500 p-3 rounded font-bold text-sm shadow">🏁 Fullfør Klasse mot klasse</button>
            </div>
        </div>

        <!-- Legg til / Rediger Spørsmål -->
        <div id="questionSection" class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-4 hidden">
            <h2 id="formTitle" class="text-xl font-semibold text-cyan-400">2. Opprett oppgave</h2>
            <input type="hidden" id="editingQuestionId" value="">
            
            <div>
                <label class="block text-sm mb-1">Oppgavetekst:</label>
                <textarea id="qText" rows="3" placeholder="F.eks. Hvor lang tid bruker rektor på å løpe 100 meter?" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Hvilken klasse har laget oppgaven?</label>
                    <select id="qCreatorClass" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                        <option value="Arrangør">Arrangør (Alle kan svare)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-1">Enhet:</label>
                    <select id="qUnitType" onchange="handleUnitChange()" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                        <option value="tid">Tid (skriv som min:sek)</option>
                        <option value="cm">cm</option>
                        <option value="meter">meter</option>
                        <option value="liter">liter</option>
                        <option value="antall">antall</option>
                        <option value="egendefinert">Egendefinert</option>
                    </select>
                </div>
            </div>

            <div id="customUnitContainer" class="hidden">
                <label class="block text-sm mb-1">Skriv inn egendefinert enhet:</label>
                <input type="text" id="qCustomUnit" placeholder="F.eks. kg, poeng" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm mb-1">Minimum utfall:</label>
                    <input type="text" id="qMin" placeholder="0" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1">Maksimum utfall:</label>
                    <input type="text" id="qMax" placeholder="300" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1">Steg:</label>
                    <input type="number" step="any" id="qStep" value="1" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                </div>
            </div>

            <div>
                <label class="block text-sm mb-1">Fasit:</label>
                <input type="text" id="qCorrect" placeholder="F.eks. 1:15" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
            </div>

            <div class="flex gap-4">
                <button id="saveQuestionBtn" class="bg-cyan-600 hover:bg-cyan-500 px-6 py-3 rounded font-bold flex-1 text-lg">Lagre Oppgave</button>
                <button id="cancelEditBtn" class="bg-slate-600 hover:bg-slate-500 px-4 py-3 rounded font-bold hidden">Avbryt</button>
            </div>
        </div>

        <!-- Spørsmålsbank -->
        <div id="questionListSection" class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-4 hidden">
            <h2 class="text-xl font-semibold text-yellow-400">3. Spørsmålsbank for denne konkurransen</h2>
            <div id="questionsContainer" class="space-y-3"></div>
        </div>
    </div>

    <!-- Modal for Topp 3 eller Sluttresultat -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4 max-h-[80vh] overflow-y-auto">
            <h3 id="modalTitle" class="text-2xl font-bold text-yellow-400">Resultat</h3>
            <div id="modalContent" class="space-y-3 text-slate-300"></div>
            <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 p-2.5 rounded font-bold">Lukk</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        let currentQuestions = [];
        let allClasses = [];

        async function initData() {
            const { data: classesData } = await supabase.from('classes').select('*').order('name');
            allClasses = classesData || [];
            updateCreatorClassDropdown();

            const { data: comps } = await supabase.from('competitions').select('*');
            const select = document.getElementById('competitionSelect');
            select.innerHTML = '<option value="">-- Velg konkurranse --</option>' + (comps || []).map(co => `
                <option value="${co.id}">${co.title}</option>
            `).join('');
        }

        function updateCreatorClassDropdown() {
            const select = document.getElementById('qCreatorClass');
            let html = '<option value="Arrangør">Arrangør (Alle kan svare)</option>';
            allClasses.forEach(c => { html += `<option value="${c.name}">${c.name}</option>`; });
            select.innerHTML = html;
        }

        window.renderClassCheckboxes = function(selectedClassNames = []) {
            const box = document.getElementById('classListCheckboxes');
            box.innerHTML = allClasses.map(c => {
                const isChecked = selectedClassNames.includes(c.name) ? 'checked' : '';
                return `<label class="flex items-center gap-2 cursor-pointer p-1 hover:bg-slate-800 rounded"><input type="checkbox" value="${c.name}" class="comp-class-cb w-4 h-4 accent-cyan-500" ${isChecked}> <span>${c.name}</span></label>`;
            }).join('');
        }

        window.handleUnitChange = function() {
            const val = document.getElementById('qUnitType').value;
            const container = document.getElementById('customUnitContainer');
            if (val === 'egendefinert') container.classList.remove('hidden');
            else container.classList.add('hidden');
        }

        function parseInputToNumber(valueStr) {
            if (!valueStr) return null;
            valueStr = String(valueStr).trim();
            if (valueStr.includes(':')) {
                const parts = valueStr.split(':');
                return (parseFloat(parts[0]) || 0) * 60 + (parseFloat(parts[1]) || 0);
            }
            return parseFloat(valueStr);
        }

        async function loadQuestionsForCompetition(compId) {
            const section = document.getElementById('questionListSection');
            const container = document.getElementById('questionsContainer');
            if (!compId) {
                section.classList.add('hidden');
                document.getElementById('liveControlSection').classList.add('hidden');
                return;
            }
            section.classList.remove('hidden');
            document.getElementById('liveControlSection').classList.remove('hidden');

            const { data: questions } = await supabase.from('questions').select('*').eq('competition_id', compId).order('sort_order');
            currentQuestions = questions || [];

            container.innerHTML = currentQuestions.map((q, index) => `
                <div class="bg-slate-900 p-4 rounded border border-slate-700 flex justify-between items-center">
                    <div>
                        <span class="text-cyan-400 font-bold">#${index + 1}</span> <span class="font-medium">${q.question_text}</span> 
                        <span class="text-xs ml-2 px-2 py-0.5 rounded bg-slate-800 text-yellow-300">Status: ${q.status}</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editQuestion(${q.id})" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-sm font-bold">Rediger</button>
                        <button onclick="deleteQuestion(${q.id})" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm font-bold">Slett</button>
                    </div>
                </div>
            `).join('');
        }

        // --- LIVE SPILLKONTROLLER ---
        window.startKlasseMotKlasse = async function() {
            const compId = document.getElementById('competitionSelect').value;
            if (!compId || currentQuestions.length === 0) return alert('Ingen oppgaver funnet.');
            
            // Sett første oppgave til 'active'
            const firstQ = currentQuestions[0];
            await supabase.from('questions').update({ status: 'active' }).eq('id', firstQ.id);
            document.getElementById('activeLiveStatus').textContent = `Aktiv oppgave: "${firstQ.question_text}" er nå ÅPEN for svar!`;
            alert('Første oppgave er startet på elevtelefonene!');
        }

        window.lockAnswersCountdown = async function() {
            const activeQ = currentQuestions.find(q => q.status === 'active');
            if (!activeQ) return alert('Ingen aktiv oppgave å låse.');

            for (let i = 5; i > 0; i--) {
                document.getElementById('activeLiveStatus').textContent = `Låser om ${i} sekunder...`;
                await new Promise(r => setTimeout(r, 1000));
            }

            await supabase.from('questions').update({ status: 'locked' }).eq('id', activeQ.id);
            activeQ.status = 'locked';
            document.getElementById('activeLiveStatus').textContent = `Svarene er LÅST for oppgave: "${activeQ.question_text}".`;
            alert('Tiden er ute! Svarene er låst.');
        }

        window.openAnswersAgain = async function() {
            const lockedQ = currentQuestions.find(q => q.status === 'locked' || q.status === 'active');
            if (!lockedQ) return alert('Ingen aktuell oppgave å åpne.');

            await supabase.from('questions').update({ status: 'active' }).eq('id', lockedQ.id);
            lockedQ.status = 'active';
            document.getElementById('activeLiveStatus').textContent = `Oppgaven er gjenåpnet for svar!`;
            alert('Svarene er åpnet igjen.');
        }

        window.nextQuestion = async function() {
            const currentIndex = currentQuestions.findIndex(q => q.status === 'active' || q.status === 'locked');
            
            // Sett nåværende til 'done'
            if (currentIndex !== -1) {
                await supabase.from('questions').update({ status: 'done' }).eq('id', currentQuestions[currentIndex].id);
            }

            const nextIndex = currentIndex === -1 ? 0 : currentIndex + 1;
            if (nextIndex >= currentQuestions.length) {
                alert('Dette var siste oppgave!');
                return;
            }

            const nextQ = currentQuestions[nextIndex];
            await supabase.from('questions').update({ status: 'active' }).eq('id', nextQ.id);
            await loadQuestionsForCompetition(document.getElementById('competitionSelect').value);
            document.getElementById('activeLiveStatus').textContent = `Neste oppgave aktiv: "${nextQ.question_text}"`;
            alert('Neste oppgave er sendt ut til elevene!');
        }

        window.showTop3Modal = function() {
            document.getElementById('modalTitle').textContent = '🏆 Topp 3 Oversikt';
            document.getElementById('modalContent').innerHTML = `<p class="italic">Her hentes statistikk over beste enkeltelever og klasser basert på innsendte svar mot fasit.</p>`;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        window.completeCompetition = async function() {
            if (!confirm('Vil du fullføre og avslutte hele konkurransen?')) return;
            document.getElementById('modalTitle').textContent = '🏁 Sluttresultat - Klasse mot klasse';
            document.getElementById('modalContent').innerHTML = `<p class="font-bold text-emerald-400">Konkurransen er avsluttet! Sluttabell for klasser og enkeltelever vises her.</p>`;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        document.getElementById('competitionSelect').addEventListener('change', (e) => {
            loadQuestionsForCompetition(e.target.value);
        });

        initData();
    </script>
</body>
</html>
