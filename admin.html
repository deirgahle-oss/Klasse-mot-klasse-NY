<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Arrangør - Klasse mot klasse</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-yellow-400">Arrangørpanel - Klasse mot klasse</h1>

        <!-- Statusboks for tilkobling -->
        <div id="connectionStatus" class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-sm text-slate-300">
            Kobler til databasen...
        </div>

        <!-- Konkurranse- og klasseadministrasjon -->
        <div class="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 space-y-6">
            <h2 class="text-xl font-semibold text-cyan-400">1. Administrer Konkurranse & Klasser</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-900 p-4 rounded border border-slate-700">
                    <label class="block text-sm mb-1 font-semibold">Opprett ny konkurranse:</label>
                    <input type="text" id="compTitle" placeholder="F.eks. Klasse mot klasse - Vår 2026" class="w-full p-2 rounded bg-slate-800 border border-slate-600 text-white mb-2">
                    <button onclick="opprettKonkurranse()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded font-bold w-full">Opprett Konkurranse</button>
                </div>

                <div class="bg-slate-900 p-4 rounded border border-slate-700">
                    <label class="block text-sm mb-1 font-semibold">Legg til ny klasse i systemet:</label>
                    <div class="flex gap-2">
                        <input type="text" id="classNameInput" placeholder="F.eks. 10B eller Media" class="w-full p-2 rounded bg-slate-800 border border-slate-600 text-white">
                        <button onclick="leggTilKlasse()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-bold">Legg til</button>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm mb-1 font-semibold">Velg aktiv konkurranse:</label>
                <select id="competitionSelect" onchange="velgKonkurranse(this.value)" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                    <option value="">-- Velg konkurranse --</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        // Bruker 'db' i stedet for 'supabase' for å unngå duplikat-kollisjoner
        const supabaseUrl = 'https://uwsvsfepktigasnpolql.supabase.co';
        const supabaseKey = 'sb_publishable_BevPqXgGFbuGtRBvz0uQNQ_yuSqxbSx';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        async function init() {
            try {
                const { data, error } = await db.from('classes').select('*');
                if (error) {
                    document.getElementById('connectionStatus').innerHTML = '<span class="text-red-400 font-bold">Databasefeil: ' + error.message + '</span>';
                    return;
                }
                document.getElementById('connectionStatus').innerHTML = '<span class="text-emerald-400 font-bold">Tilkoblet Supabase med suksess! (' + data.length + ' klasser registrert)</span>';
                
                await lastInnKonkurranser();
            } catch (err) {
                document.getElementById('connectionStatus').innerHTML = '<span class="text-red-400 font-bold">Kritisk feil ved oppstart: ' + err.message + '</span>';
            }
        }

        async function lastInnKonkurranser() {
            const select = document.getElementById('competitionSelect');
            const { data: comps, error } = await db.from('competitions').select('*').order('id', { ascending: false });
            
            if (error || !comps || comps.length === 0) {
                select.innerHTML = '<option value="">-- Ingen konkurranser funnet --</option>';
                return;
            }

            select.innerHTML = '<option value="">-- Velg konkurranse --</option>' + comps.map(co => `
                <option value="${co.id}">${co.title || 'Uten navn'} (Status: ${co.status || 'setup'})</option>
            `).join('');

            const lagretId = localStorage.getItem('kmk_active_comp_id');
            if (lagretId && select.querySelector(`option[value="${lagretId}"]`)) {
                select.value = lagretId;
            }
        }

        async function opprettKonkurranse() {
            const tittelInput = document.getElementById('compTitle');
            const tittel = tittelInput.value.trim();
            if (!tittel) {
                alert('Vennligst skriv inn et navn på konkurransen.');
                return;
            }

            const { error } = await db.from('competitions').insert([{ title: tittel, status: 'setup' }]);
            if (error) {
                alert('Feil ved opprettelse: ' + error.message);
                return;
            }

            alert('Konkurransen "' + tittel + '" ble opprettet!');
            tittelInput.value = '';
            lastInnKonkurranser();
        }

        async function leggTilKlasse() {
            const klasseInput = document.getElementById('classNameInput');
            const navn = klasseInput.value.trim();
            if (!navn) {
                alert('Vennligst skriv inn et klassenavn.');
                return;
            }

            const { error } = await db.from('classes').insert([{ name: navn }]);
            if (error) {
                alert('Feil ved opprettelse av klasse: ' + error.message);
                return;
            }

            alert('Klassen "' + navn + '" ble lagt til!');
            klasseInput.value = '';
            init();
        }

        function velgKonkurranse(id) {
            if (id) {
                localStorage.setItem('kmk_active_comp_id', id);
            } else {
                localStorage.removeItem('kmk_active_comp_id');
            }
        }

        init();
    </script>
</body>
</html>
