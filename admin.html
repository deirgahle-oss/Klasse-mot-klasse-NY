<script>
        // Supabase-oppsett (uten duplikat 'const')
        const supabaseUrl = 'https://uwsvsfepktigasnpolql.supabase.co';
        const supabaseKey = 'sb_publishable_BevPqXgGFbuGtRBvz0uQNQ_yuSqxbSx';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function init() {
            try {
                const { data, error } = await supabase.from('classes').select('*');
                if (error) {
                    document.getElementById('connectionStatus').innerHTML = '<span class="text-red-400 font-bold">Databasefeil: ' + error.message + '</span>';
                    return;
                }
                document.getElementById('connectionStatus').innerHTML = '<span class="text-emerald-400 font-bold">Tilkoblet Supabase med suksess! (' + data.length + ' klasser registrert)</span>';
                
                await lastInnKonkurranser();
            } catch (err) {
                document.getElementById('connectionStatus').innerHTML = '<span class="text-red-400 font-bold">Kritisk feil ved oppstart: ' + err.message + '</span>';
            }
        }

        async function lastInnKonkurranser() {
            const select = document.getElementById('competitionSelect');
            const { data: comps, error } = await supabase.from('competitions').select('*').order('id', { ascending: false });
            
            if (error || !comps || comps.length === 0) {
                select.innerHTML = '<option value="">-- Ingen konkurranser funnet --</option>';
                return;
            }

            select.innerHTML = '<option value="">-- Velg konkurranse --</option>' + comps.map(co => `
                <option value="${co.id}">${co.title || 'Uten navn'} (Status: ${co.status || 'setup'})</option>
            `).join('');

            const lagretId = localStorage.getItem('kmk_active_comp_id');
            if (lagretId && select.querySelector(`option[value="${lagretId}"]`)) {
                select.value = lagretId;
            }
        }

        async function opprettKonkurranse() {
            const tittelInput = document.getElementById('compTitle');
            const tittel = tittelInput.value.trim();
            if (!tittel) {
                alert('Vennligst skriv inn et navn på konkurransen.');
                return;
            }

            const { error } = await supabase.from('competitions').insert([{ title: tittel, status: 'setup' }]);
            if (error) {
                alert('Feil ved opprettelse: ' + error.message);
                return;
            }

            alert('Konkurransen "' + tittel + '" ble opprettet!');
            tittelInput.value = '';
            lastInnKonkurranser();
        }

        async function leggTilKlasse() {
            const klasseInput = document.getElementById('classNameInput');
            const navn = klasseInput.value.trim();
            if (!navn) {
                alert('Vennligst skriv inn et klassenavn.');
                return;
            }

            const { error } = await supabase.from('classes').insert([{ name: navn }]);
            if (error) {
                alert('Feil ved opprettelse av klasse: ' + error.message);
                return;
            }

            alert('Klassen "' + navn + '" ble lagt til!');
            klasseInput.value = '';
            init();
        }

        function velgKonkurranse(id) {
            if (id) {
                localStorage.setItem('kmk_active_comp_id', id);
            } else {
                localStorage.removeItem('kmk_active_comp_id');
            }
        }

        init();
    </script>
